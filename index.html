<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Wiki de l’Univers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Police -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- CSS global -->
  <link rel="stylesheet" href="/royaumededraevorn/css/wiki.css">

  <!-- =========================
       STYLES LOCAUX (INDEX)
       ========================= -->
  <style>

  /* =========================
     EVENT BOARD
     ========================= */
  .event-board{
    margin: 14px 0 18px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.035);
    box-shadow: 0 18px 45px rgba(0,0,0,.45);
    overflow: hidden;
  }

  .event-board-head{
    padding: 12px 14px;
    display:flex;
    justify-content: space-between;
    align-items:center;
    border-bottom: 1px solid rgba(255,255,255,.08);
    background: linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
  }

  .event-board-title{
    display:flex;
    align-items:center;
    gap: 10px;
    font-weight: 900;
  }

  .event-ico{
    width: 28px;
    height: 28px;
    border-radius: 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.08);
  }

  .event-board-pill{
    font-size:.72rem;
    padding: 5px 9px;
    border-radius:999px;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.06);
  }

  .event-board-body{
    padding: 12px 14px;
    display:flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Toggle */
  .event-toggle{
    display:flex;
    align-items:center;
    gap: 10px;
    cursor:pointer;
    font-weight: 800;
  }
  .event-toggle input{ display:none; }

  .event-toggle-ui{
    width: 46px;
    height: 26px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.06);
    position: relative;
  }
  .event-toggle-ui::after{
    content:"";
    position:absolute;
    top:3px;
    left:3px;
    width:20px;
    height:20px;
    border-radius:999px;
    background: rgba(255,255,255,.25);
    transition: transform .2s ease;
  }
  .event-toggle input:checked + .event-toggle-ui::after{
    transform: translateX(20px);
    background: rgba(255,90,90,.45);
  }

  /* Event card */
  .event-card{
    display:flex;
    gap: 14px;
    padding: 12px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.03);
  }

  .event-catastrophe{
    border-color: rgba(255,90,90,.28);
    animation: dangerPulse 1.3s infinite;
  }

  @keyframes dangerPulse{
    0%,100%{ filter: brightness(1); }
    50%{ filter: brightness(1.15); }
  }

  .event-left{ flex:1; }
  .event-title{ font-weight:900; margin:6px 0; }
  .event-desc{ opacity:.88; }

  .event-right{
    flex:0 0 200px;
    display:flex;
    align-items:center;
  }

  .event-timer{
    width:100%;
    padding:10px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.12);
    background: rgba(0,0,0,.2);
    text-align:right;
  }

  .event-timer-label{ font-size:.75rem; opacity:.8; }
  .event-timer-value{ font-weight:900; font-size:1.1rem; }
  .event-timer-sub{ font-size:.75rem; opacity:.8; }

  @media (max-width:720px){
    .event-card{ flex-direction:column; }
    .event-right{ flex:1; text-align:left; }
  }

  </style>
</head>

<body>

<div class="wiki-container">

  <!-- HERO -->
  <div class="wiki-hero">
    <div>
      <h1>Wiki de l’Univers</h1>
      <p>Encyclopédie officielle : personnages, factions, chronologie et arcs RP.</p>
    </div>
    <div class="wiki-search">
      <input id="q" placeholder="Rechercher..." />
      <button id="go">Rechercher</button>
    </div>
  </div>

  <!-- =========================
       EVENT BOARD (TOP)
       ========================= -->
  <section class="event-board" id="eventBoard">
    <div class="event-board-head">
      <div class="event-board-title">
        <span class="event-ico">⚠️</span>
        <span>Évènements</span>
        <span class="event-board-pill">Live</span>
      </div>

      <label class="event-toggle">
        <input type="checkbox" id="eventToggle" checked>
        <span class="event-toggle-ui"></span>
        <span class="event-toggle-text">Actif</span>
      </label>
    </div>

    <div class="event-board-body" id="eventList">

      <!-- Exemple actif -->
      <article class="event-card event-catastrophe"
        data-event
        data-target="2026-02-12T21:00:00+01:00"
        data-link="personnage-godzilla.html">

        <div class="event-left">
          <div class="event-title">Burning Godzilla — Arrivée</div>
          <div class="event-desc">
            Une présence colossale approche. Tempêtes, marées extrêmes… le monde retient son souffle.
          </div>
        </div>

        <div class="event-right">
          <div class="event-timer">
            <div class="event-timer-label">Arrive dans</div>
            <div class="event-timer-value" data-timer>--:--:--</div>
            <div class="event-timer-sub" data-eta>—</div>
          </div>
        </div>

      </article>

    </div>
  </section>

  <!-- CONTENU PRINCIPAL -->
  <div class="wiki-grid">
    <!-- (ton contenu spotlight / sidebar / etc reste inchangé ici) -->
  </div>

</div>

<!-- =========================
     SCRIPTS (ORDRE IMPORTANT)
     ========================= -->

<!-- 1️⃣ Recherche -->
<script src="/royaumededraevorn/js/wiki-search.js"></script>

<!-- 2️⃣ JS EVENT BOARD -->
<script>
(function(){
  const board = document.getElementById("eventBoard");
  const toggle = document.getElementById("eventToggle");
  const list = document.getElementById("eventList");
  if(!board || !toggle || !list) return;

  const KEY = "wiki_events_enabled";

  function setEnabled(v){
    toggle.checked = v;
    list.style.display = v ? "" : "none";
    localStorage.setItem(KEY, v ? "1" : "0");
  }

  setEnabled(localStorage.getItem(KEY) !== "0");

  toggle.addEventListener("change", () => setEnabled(toggle.checked));

  function pad(n){ return String(n).padStart(2,"0"); }

  function tick(){
    const now = Date.now();
    document.querySelectorAll("[data-event]").forEach(card=>{
      const t = new Date(card.dataset.target).getTime();
      const diff = t - now;
      const tEl = card.querySelector("[data-timer]");
      const eta = card.querySelector("[data-eta]");
      if(diff <= 0){
        tEl.textContent = "ARRIVÉ";
        eta.textContent = "— maintenant";
        return;
      }
      const s = Math.floor(diff/1000);
      const h = Math.floor(s/3600);
      const m = Math.floor((s%3600)/60);
      const sec = s%60;
      tEl.textContent = `${pad(h)}:${pad(m)}:${pad(sec)}`;
    });
  }

  tick();
  setInterval(tick,1000);
})();
</script>

</body>
</html>
